[project]
name = "scene-graph-query"
version = "0.1.0"
description = "Natural language search over images using scene graphs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "nullsector", email = "" }
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "networkx>=3.0",
    "gradio>=4.0.0",
    "numpy>=1.24.0",
    "transformers>=4.57.6",
]

[dependency-groups]
dev = [
    "bandit>=1.7.0",
    "safety>=2.3.0",
    "pre-commit>=3.0.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "pytest>=7.4.0",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line-length = 100
